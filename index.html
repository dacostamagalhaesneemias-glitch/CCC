<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Central de Compras e Cotações</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#4F46E5;--brand-l:#6366f1;--brand-xl:#EEF2FF;
  --green:#059669;--green-l:#D1FAE5;
  --red:#DC2626;--red-l:#FEE2E2;
  --amber:#D97706;--amber-l:#FEF3C7;
  --blue:#4B5563;--blue-l:#E5E7EB;
  --purple:#7C3AED;--purple-l:#EDE9FE;
  --s9:#20242B;--s8:#374151;--s7:#3F464E;--s6:#4B5563;--s5:#6B7280;
  --s4:#9CA3AF;--s3:#CBD5E1;--s2:#E3E6EA;--s1:#F1F5F9;--s0:#F7F8F9;
  --w:#FFFFFF;
}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--s0);color:var(--s8);min-height:100vh;display:flex}
#sb{width:228px;min-height:100vh;background:var(--w);border-right:1px solid var(--s2);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:transform .25s}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--s1);display:flex;align-items:center;gap:10px}
.sb-ic{width:32px;height:32px;background:linear-gradient(135deg,var(--brand),#818cf8);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:10px;flex-shrink:0}
.sb-t{font-size:12px;font-weight:800;color:var(--s9);line-height:1.2}
.sb-s{font-size:9px;font-weight:700;color:var(--brand);letter-spacing:.5px;text-transform:uppercase}
.sb-nav{padding:10px 8px;flex:1}
.sb-sec{font-size:9px;font-weight:700;color:var(--s4);letter-spacing:.8px;text-transform:uppercase;padding:10px 8px 5px}
.sb-a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--s6);font-size:13px;font-weight:500;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;transition:all .12s}
.sb-a:hover{background:var(--s0);color:var(--s8)}
.sb-a.on{background:var(--brand-xl);color:var(--brand);font-weight:700}
.sb-bdg{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:1px 6px;border-radius:20px}
.sb-ft{padding:12px 14px;border-top:1px solid var(--s1)}
.sb-u{display:flex;align-items:center;gap:8px}
.sb-av{width:28px;height:28px;background:linear-gradient(135deg,var(--brand),#818cf8);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:10px;flex-shrink:0}
.sb-un{font-weight:700;color:var(--s8);font-size:11px}
.sb-ui{font-size:10px;color:var(--s5)}
#main{margin-left:228px;flex:1;display:flex;flex-direction:column;min-height:100vh}
#tb{background:var(--w);border-bottom:1px solid var(--s2);padding:0 26px;height:54px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
#tb-t{font-size:14px;font-weight:700;color:var(--s9)}
#tb-s{font-size:11px;color:var(--s4);margin-top:1px}
#ct{padding:22px 26px;flex:1}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.pt{font-size:21px;font-weight:900;color:var(--s9);letter-spacing:-.3px}
.ps{font-size:12px;color:var(--s5);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .12s;white-space:nowrap;line-height:1;font-family:inherit}
.bp{background:var(--brand);color:#fff}.bp:hover{background:var(--brand-l);box-shadow:0 4px 12px rgba(79,70,229,.3);transform:translateY(-1px)}
.bs{background:var(--w);color:var(--s7);border:1.5px solid var(--s2)}.bs:hover{background:var(--s0);border-color:var(--s3)}
.bd{background:var(--red-l);color:var(--red);border:1px solid #fca5a5}.bd:hover{background:#fecaca}
.bg2{background:none;color:var(--s5);padding:5px 9px}.bg2:hover{background:var(--s1);color:var(--s7)}
.bsm{padding:6px 12px;font-size:11px}
.bxs{padding:3px 8px;font-size:10px;border-radius:5px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.card{background:var(--w);border-radius:14px;border:1px solid var(--s2);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ch{padding:13px 20px;border-bottom:1px solid var(--s1);display:flex;align-items:center;justify-content:space-between;gap:10px}
.ct2{font-size:13px;font-weight:700;color:var(--s8)}
.cb2{padding:18px 20px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(144px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--w);border-radius:12px;border:1px solid var(--s2);padding:14px;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .12s}
.kpi:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
.ki{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.kl{font-size:9px;font-weight:700;color:var(--s5);text-transform:uppercase;letter-spacing:.5px;line-height:1.3}
.kv{font-size:24px;font-weight:900;color:var(--s9);line-height:1;letter-spacing:-.5px}
.ksb{font-size:10px;color:var(--s4)}
.kpi.R .kv{color:var(--red)}.kpi.R .ki{background:var(--red-l)}
.kpi.A .kv{color:var(--amber)}.kpi.A .ki{background:var(--amber-l)}
.kpi.G .kv{color:var(--green)}.kpi.G .ki{background:var(--green-l)}
.kpi.B .kv{color:var(--blue)}.kpi.B .ki{background:var(--blue-l)}
.kpi.P .kv{color:var(--brand)}.kpi.P .ki{background:var(--brand-xl)}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.bg{background:var(--green-l);color:var(--green)}
.br{background:var(--red-l);color:var(--red)}
.ba{background:var(--amber-l);color:var(--amber)}
.bb{background:var(--blue-l);color:var(--blue)}
.bP{background:var(--brand-xl);color:var(--brand)}
.bpu{background:var(--purple-l);color:var(--purple)}
.bk{background:var(--s1);color:var(--s6)}
.chip{display:inline-flex;align-items:center;padding:1px 6px;border-radius:20px;font-size:9px;font-weight:700;white-space:nowrap}
.cr{background:var(--red-l);color:var(--red)}
.ca{background:var(--amber-l);color:var(--amber)}
.cbl{background:var(--blue-l);color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.fg{display:grid;gap:12px}
.fg2{grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fgroup{display:flex;flex-direction:column;gap:4px}
.lbl{font-size:10px;font-weight:700;color:var(--s6);text-transform:uppercase;letter-spacing:.4px}
.req{color:var(--red);margin-left:1px}
.fi,.fs,.fta{border:1.5px solid var(--s2);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--s8);background:var(--w);transition:border .12s;width:100%;font-family:inherit}
.fi:focus,.fs:focus,.fta:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.fta{resize:vertical;min-height:62px}
.fval{border:1.5px solid var(--s2);border-radius:8px;padding:8px 11px;font-size:12px;background:var(--brand-xl);color:var(--brand);font-weight:700}
.ferr{font-size:10px;color:var(--red);margin-top:2px}
.fsect{background:var(--s0);border:1px solid var(--s2);border-radius:10px;padding:12px 14px;margin-top:8px}
.fst{font-size:9px;font-weight:800;color:var(--s5);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.cblock{background:var(--w);border:1.5px solid var(--s2);border-radius:12px;padding:16px;transition:border .12s}
.cblock:hover{border-color:var(--s3)}
.cbh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cbn{font-size:10px;font-weight:800;color:var(--brand);background:var(--brand-xl);padding:3px 9px;border-radius:20px}
.sbar{background:linear-gradient(135deg,var(--brand-xl),#ede9fe);border:1px solid #c7d2fe;border-radius:10px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px}
.sbar-l{font-size:11px;color:var(--s6);font-weight:600}
.sbar-v{font-size:18px;font-weight:900;color:var(--brand)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--s2)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--s0);padding:9px 13px;text-align:left;font-size:9px;font-weight:700;color:var(--s5);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--s2);cursor:pointer;user-select:none}
thead th:hover{color:var(--s8)}
tbody tr{border-bottom:1px solid var(--s1);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--s0)}
tbody td{padding:9px 13px;vertical-align:middle}
.tm{font-weight:600;color:var(--s8)}
.tsb{font-size:10px;color:var(--s4);margin-top:2px}
.tmo{font-family:monospace;font-weight:700;color:var(--brand);cursor:pointer}
.tmo:hover{text-decoration:underline}
.tv{font-weight:700;color:var(--s7)}
.fbar{background:var(--w);border:1px solid var(--s2);border-radius:12px;padding:11px 13px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.fbar .fi,.fbar .fs{font-size:11px;padding:6px 10px}
.fsrch{min-width:200px;flex:1}
.fcb{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;cursor:pointer;color:var(--s6);padding:6px 9px;border-radius:8px;border:1.5px solid var(--s2);background:var(--w);transition:all .12s;white-space:nowrap;user-select:none}
.fcb input{width:13px;height:13px;accent-color:var(--brand);cursor:pointer}
.fcb.on{border-color:var(--brand);background:var(--brand-xl);color:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.overlay.h{display:none}
.modal{background:var(--w);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:960px}
.mhd{padding:16px 20px;border-bottom:1px solid var(--s1);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mttl{font-size:14px;font-weight:800;color:var(--s9)}
.mx{width:26px;height:26px;border-radius:6px;border:none;background:var(--s1);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--s5)}
.mx:hover{background:var(--s2)}
.mbd{padding:18px 20px;overflow-y:auto;flex:1}
.mft{padding:12px 20px;border-top:1px solid var(--s1);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.cbox{background:var(--w);border:1px solid var(--s2);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ctitle{font-size:12px;font-weight:700;color:var(--s7);margin-bottom:12px}
.thero{background:linear-gradient(135deg,var(--brand) 0%,#818cf8 100%);border-radius:14px;padding:20px 22px;color:#fff;margin-bottom:14px}
.thnum{font-size:26px;font-weight:900;letter-spacing:-1px}
.thmeta{font-size:12px;opacity:.85;margin-top:3px}
.tstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tstat{background:rgba(255,255,255,.15);border-radius:9px;padding:10px;text-align:center}
.tsv{font-size:20px;font-weight:900}
.tsl{font-size:9px;opacity:.8;margin-top:1px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.histitem{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--s1)}
.histitem:last-child{border-bottom:none}
.hdot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex-shrink:0;margin-top:5px}
.hbody{font-size:11px;color:var(--s6);line-height:1.5}
.hfld{font-family:monospace;background:var(--s1);padding:1px 5px;border-radius:3px;color:var(--s7)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--s2);margin-bottom:18px}
.tab{padding:8px 14px;font-size:12px;font-weight:600;color:var(--s5);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .12s;border-radius:8px 8px 0 0}
.tab:hover{color:var(--s8);background:var(--s0)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.pag{display:flex;align-items:center;gap:7px;padding:10px 13px;border-top:1px solid var(--s1)}
.pag-i{font-size:11px;color:var(--s5);margin-right:auto}
.empty{text-align:center;padding:42px 20px}
.ei{font-size:32px;margin-bottom:8px}
.et{font-size:13px;font-weight:600;color:var(--s5)}
.es{font-size:11px;color:var(--s4);margin-top:3px}
.alert{border-radius:8px;padding:9px 13px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.aok{background:var(--green-l);color:var(--green);border:1px solid #a7f3d0}
.aerr{background:var(--red-l);color:var(--red);border:1px solid #fca5a5}
#toast{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.ti{background:var(--s9);color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.2);opacity:0;transform:translateY(6px);transition:all .22s;pointer-events:auto;display:flex;align-items:center;gap:7px}
.ti.show{opacity:1;transform:translateY(0)}
.ti.ok{background:var(--green)}
.ti.err{background:var(--red)}
.hbg{display:none;padding:7px;border:none;background:none;cursor:pointer;color:var(--s7);font-size:18px;align-items:center}
@media(max-width:900px){
  #sb{transform:translateX(-100%)}
  #sb.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.2)}
  #main{margin-left:0}
  .cgrid{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr 1fr}
  .tstats{grid-template-columns:1fr 1fr}
  .hbg{display:flex}
}
@media(max-width:600px){
  #ct{padding:14px}
  .fg2,.fg3{grid-template-columns:1fr}
  .kgrid{grid-template-columns:1fr 1fr}
}

.sync-pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--s1);color:var(--s6);border:1px solid var(--s2)}
.sync-pill.ok{background:var(--green-l);color:var(--green);border-color:#a7f3d0}
.sync-pill.wait{background:var(--amber-l);color:var(--amber);border-color:#fde68a}
.sync-pill.err{background:var(--red-l);color:var(--red);border-color:#fca5a5}

/* ── LOGIN ─────────────────────────────────────── */
#login-screen{position:fixed;inset:0;z-index:9999;background:#eef0f2;display:flex;align-items:center;justify-content:center;padding:24px}
#login-screen.h{display:none}
.login-card{width:min(430px,100%);background:#fff;border:1px solid #dfe3e8;border-radius:18px;padding:34px;box-shadow:0 20px 55px rgba(15,23,42,.10)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.login-logo{width:42px;height:42px;border-radius:11px;background:#2f343a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;letter-spacing:.4px}
.login-brand-title{font-size:18px;font-weight:800;color:#20242a;line-height:1.1}.login-brand-sub{font-size:11px;color:#7a828c;margin-top:3px}
.login-card h1{font-size:25px;line-height:1.15;color:#20242a;margin-bottom:7px}.login-card .login-intro{font-size:13px;color:#747c86;margin-bottom:24px;line-height:1.5}
.login-field{margin-bottom:15px}.login-field label{display:block;font-size:11px;font-weight:800;color:#3f454d;margin-bottom:6px}.login-field input{width:100%;height:44px;border:1.5px solid #d7dce1;border-radius:9px;padding:0 12px;font-size:14px;color:#20242a;background:#fafbfc;outline:none}.login-field input:focus{border-color:#8f969e;background:#fff;box-shadow:0 0 0 3px rgba(47,52,58,.07)}
.login-btn{width:100%;height:44px;border:0;border-radius:9px;background:#2f343a;color:#fff;font-size:13px;font-weight:800;cursor:pointer;margin-top:5px}.login-btn:hover{background:#24282d}.login-btn:disabled{opacity:.55;cursor:not-allowed}
.login-err{min-height:18px;margin-top:12px;font-size:11px;color:#b42318;text-align:center}
.logout-btn{margin-left:auto;border:0;background:transparent;color:#7a828c;font-size:15px;cursor:pointer;padding:4px 6px;border-radius:6px}.logout-btn:hover{background:#eceff1;color:#252a30}


/* Busca global */
.gsearch{position:relative;margin-left:auto;width:min(330px,30vw)}
.gsearch-in{width:100%;height:36px;border:1px solid #DDE1E5;border-radius:10px;background:#F7F8F9;padding:0 36px 0 12px;font:inherit;font-size:12px;color:#2F343B;outline:none;transition:.15s}
.gsearch-in:focus{background:#fff;border-color:#9CA3AF;box-shadow:0 0 0 3px rgba(75,85,99,.08)}
.gsearch-ico{position:absolute;right:11px;top:9px;font-size:13px;pointer-events:none;opacity:.55}
.gsearch-box{display:none;position:absolute;top:42px;left:0;right:0;max-height:390px;overflow:auto;background:#fff;border:1px solid #DDE1E5;border-radius:12px;box-shadow:0 16px 38px rgba(17,24,39,.14);z-index:300;padding:6px}
.gsearch-box.on{display:block}
.gsr{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer}
.gsr:hover{background:#F1F3F5}.gsr-ic{width:28px;height:28px;border-radius:7px;background:#EEF0F2;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:13px}
.gsr-main{min-width:0;flex:1}.gsr-title{font-size:11.5px;font-weight:750;color:#252A31;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gsr-sub{font-size:9.8px;color:#7B838D;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gsr-kind{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#8B929B;margin-top:2px}
.gsr-empty{padding:18px 12px;text-align:center;color:#8B929B;font-size:11px}
@media(max-width:1050px){.gsearch{width:230px}}
@media(max-width:760px){.gsearch{width:45vw}.gsearch-in{font-size:11px}#tb-s{display:none}.sync-pill{display:none!important}}

</style>
<style id="modern-corporate-theme">
:root{
  --brand:#4B5563;--brand-l:#6B7280;--brand-xl:#F3F4F6;
  --green:#059669;--green-l:#ECFDF5;
  --red:#DC2626;--red-l:#FEF2F2;
  --amber:#D97706;--amber-l:#FFFBEB;
  --blue:#6B7280;--blue-l:#F1F5F9;
  --purple:#7C3AED;--purple-l:#F5F3FF;
  --s9:#111827;--s8:#1F2937;--s7:#374151;--s6:#4B5563;--s5:#6B7280;
  --s4:#9CA3AF;--s3:#D1D5DB;--s2:#E5E7EB;--s1:#F3F4F6;--s0:#F6F7F9;
  --w:#FFFFFF;
}
html{background:#F1F3F5}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#F8F9FA 0%,#F2F4F6 100%);color:var(--s8);font-size:14px}

<script>

const SB_URL='https://moymlfqcnewgkkkkhqgv.supabase.co';
const SB_KEY='sb_publishable_qWubSUEq_J8h-cpiuQcp0w_igNLJiPl';
const AUTH_KEY='cc_auth_session';
let AUTH=null;
let USER_PROFILE={role:'usuario',nome:''};
function authHeaders(){return {
  'apikey':SB_KEY,
  'Authorization':'Bearer '+(AUTH?.access_token||SB_KEY),
  'Content-Type':'application/json'
};}
const SYNC={busy:false,ready:false,last:null,timer:null};
function syncStatus(txt,type='wait'){
  const e=document.getElementById('sync-pill');if(!e)return;
  e.className='sync-pill '+type;e.textContent='● '+txt;
}
async function sb(path,opt={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opt,headers:{...authHeaders(),...(opt.headers||{})}});
  if(!r.ok){const t=await r.text();throw new Error(t||('HTTP '+r.status));}
  const tx=await r.text();return tx?JSON.parse(tx):null;
}
async function authFetch(path,opt={}){
  const r=await fetch(SB_URL+'/auth/v1/'+path,{...opt,headers:{'apikey':SB_KEY,'Content-Type':'application/json',...(opt.headers||{})}});
  const tx=await r.text();let data=null;try{data=tx?JSON.parse(tx):null}catch{data={message:tx}}
  if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||('HTTP '+r.status));
  return data;
}

const STORAGE_BUCKET='compras-arquivos';
function storageHeaders(extra={}){return {'apikey':SB_KEY,'Authorization':'Bearer '+(AUTH?.access_token||SB_KEY),...extra};}
function storagePathUrl(path){return path.split('/').map(encodeURIComponent).join('/');}
async function storageFetch(path,opt={}){
  const r=await fetch(SB_URL+'/storage/v1/'+path,{...opt,headers:{...storageHeaders(),...(opt.headers||{})}});
  if(!r.ok){const t=await r.text();throw new Error(t||('HTTP '+r.status));}
  return r;
}
function safeFileName(name){return String(name||'arquivo').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/-+/g,'-');}
async function uploadCompraArquivo(file,compraId,tipo='anexo'){
  if(!AUTH?.access_token)throw new Error('Sessão expirada. Entre novamente.');
  if(!file)throw new Error('Arquivo não informado.');
  const max=15*1024*1024;if(file.size>max)throw new Error('O arquivo deve ter no máximo 15 MB.');
  const nome=safeFileName(file.name);const path=`${compraId}/${tipo}/${Date.now()}-${nome}`;
  await storageFetch('object/'+STORAGE_BUCKET+'/'+storagePathUrl(path),{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});
  return {path,nome:file.name,tipo:file.type||'',tamanho:file.size,enviado_em:new Date().toISOString(),por:currentUserLabel()};
}
async function apagarArquivoStorage(path){if(!path)return;try{await storageFetch('object/'+STORAGE_BUCKET+'/'+storagePathUrl(path),{method:'DELETE'});}catch(e){console.warn('Não foi possível remover arquivo antigo:',e)}}
async function baixarArquivoStorage(path,nome='arquivo'){
  try{
    const r=await storageFetch('object/authenticated/'+STORAGE_BUCKET+'/'+storagePathUrl(path));
    const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=nome||'arquivo';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  }catch(e){console.error(e);toast('Não foi possível baixar o arquivo','err');}
}
function saveAuth(a){AUTH=a||null;if(AUTH)localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH));else localStorage.removeItem(AUTH_KEY);updateUserUI();}
function loadAuth(){try{AUTH=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{AUTH=null}return AUTH;}
function isAdmin(){return USER_PROFILE?.role==='administrador';}
function currentUserLabel(){const email=AUTH?.user?.email||'';return USER_PROFILE?.nome|| (email?email.split('@')[0]:'Usuário');}

  const admin=isAdmin();

  const email=AUTH?.user?.email||'—',name=currentUserLabel(),role=isAdmin()?'Administrador':'Usuário';

  applyRoleUI();
}
async function loadUserProfile(){
  if(!AUTH?.user?.id){USER_PROFILE={role:'usuario',nome:''};updateUserUI();return false;}
  try{
    const rows=await sb('perfis?select=user_id,nome,role&user_id=eq.'+encodeURIComponent(AUTH.user.id));
    USER_PROFILE=rows&&rows[0]?rows[0]:{role:'usuario',nome:''};
    updateUserUI();return true;
  }catch(e){console.error('Erro ao carregar perfil:',e);USER_PROFILE={role:'usuario',nome:''};updateUserUI();return false;}
}
function showLogin(show=true){document.getElementById('login-screen')?.classList.toggle('h',!show);if(show)setTimeout(()=>document.getElementById('login-email')?.focus(),50);}
async function login(ev){
  ev?.preventDefault();const email=(document.getElementById('login-email')?.value||'').trim(),password=document.getElementById('login-pass')?.value||'';
  const btn=document.getElementById('login-btn'),err=document.getElementById('login-err');if(err)err.textContent='';if(btn){btn.disabled=true;btn.textContent='Entrando...'}
  try{
    const data=await authFetch('token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
    saveAuth(data);showLogin(false);syncStatus('Conectando...','wait');await loadUserProfile();await loadRemoteDB(true);nav('dashboard');startSyncTimer();
  }catch(e){if(err)err.textContent=e.message==='Invalid login credentials'?'E-mail ou senha inválidos.':(e.message||'Não foi possível entrar.');}
  finally{if(btn){btn.disabled=false;btn.textContent='Entrar'}}
}
async function refreshAuth(){
  if(!AUTH?.refresh_token)return false;
  try{const data=await authFetch('token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:AUTH.refresh_token})});saveAuth(data);return true}catch{return false}
}
async function ensureAuth(){
  loadAuth();if(!AUTH?.access_token)return false;
  try{const u=await authFetch('user',{headers:{'Authorization':'Bearer '+AUTH.access_token}});AUTH.user=u;saveAuth(AUTH);return true}catch{return await refreshAuth()}
}
async function logout(){
  try{if(AUTH?.access_token)await authFetch('logout',{method:'POST',headers:{'Authorization':'Bearer '+AUTH.access_token}})}catch{}
  if(SYNC.timer){clearInterval(SYNC.timer);SYNC.timer=null}SYNC.ready=false;SYNC.last=null;USER_PROFILE={role:'usuario',nome:''};saveAuth(null);document.getElementById('login-pass').value='';showLogin(true);
}
function startSyncTimer(){
  if(SYNC.timer)clearInterval(SYNC.timer);
  SYNC.timer=setInterval(async()=>{
    if(SYNC.busy||!AUTH?.access_token)return;
    const page=document.querySelector('.sb-a.on')?.dataset.p||'dashboard';

    if(page==='cadastro'||modalOpen||editing)return;
    const ok=await loadRemoteDB(false);if(ok)nav(page);

const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

function rowsById(arr){return Object.fromEntries((arr||[]).map(x=>[String(x.id),x]));}
const DB_DATE_FIELDS={
  tickets:new Set(['dts','ce','ae']),
  compras:new Set(['dc','pe','de','dp','dnf','dbl','ce','ae','nf_upload_em']),
  cotacoes:new Set(['data','validade','criado_em','atualizado_em']),
  historico:new Set(['em'])
};
function normalizeDBRow(table,row){
  const out={...row},keys=DB_DATE_FIELDS[table];
  if(keys)keys.forEach(k=>{if(k in out&&(out[k]===''||out[k]===undefined))out[k]=null;});
  return out;
}
async function syncTable(table,now,prev){
  const n=rowsById((now||[]).map(x=>normalizeDBRow(table,x)));
  const p=rowsById((prev||[]).map(x=>normalizeDBRow(table,x)));
  const changed=Object.values(n).filter(x=>!p[x.id]||!same(x,p[x.id]));
  const removed=Object.keys(p).filter(id=>!n[id]);
  if(changed.length) await sb(table,{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(changed)});
  for(const id of removed) await sb(table+'?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
}
async function syncAreas(now,prev){
  const n=[...new Set(now||[])],p=[...new Set(prev||[])];
  const add=n.filter(x=>!p.includes(x));
  const del=p.filter(x=>!n.includes(x));
  if(add.length) await sb('areas',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(add.map(nome=>({nome})))});
  for(const nome of del) await sb('areas?nome=eq.'+encodeURIComponent(nome),{method:'DELETE'});
}

const REF_KEYS=['ORI','DEST','TCOMP','FPAG','STCP','VERB','TITEM','CPAT','SNN','STKG'];
function refArray(tipo){
  return ({ORI,DEST,TCOMP,FPAG,STCP,VERB,TITEM,CPAT,SNN,STKG})[tipo]||null;
}
function setRefArray(tipo,valores){
  const v=[...valores];
  if(tipo==='ORI')ORI=v; else if(tipo==='DEST')DEST=v; else if(tipo==='TCOMP')TCOMP=v;
  else if(tipo==='FPAG')FPAG=v; else if(tipo==='STCP')STCP=v; else if(tipo==='VERB')VERB=v;
  else if(tipo==='TITEM')TITEM=v; else if(tipo==='CPAT')CPAT=v; else if(tipo==='SNN')SNN=v; else if(tipo==='STKG')STKG=v;
}
function refsSnapshot(){return Object.fromEntries(REF_KEYS.map(k=>[k,[...(refArray(k)||[])]]));}
function refsRows(){
  const rows=[];
  REF_KEYS.forEach(tipo=>(refArray(tipo)||[]).forEach((valor,ordem)=>rows.push({id:tipo+'__'+ordem,tipo,valor,ordem})));
  return rows;
}
async function syncRefs(now,prev){
  const n=rowsById(now),p=rowsById(prev||[]);
  const changed=Object.values(n).filter(x=>!p[x.id]||!same(x,p[x.id]));
  const removed=Object.keys(p).filter(id=>!n[id]);
  if(changed.length) await sb('referencias',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(changed)});
  for(const id of removed) await sb('referencias?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
}
function restoreLastSnapshot(){
  if(!SYNC.last)return;
  DB.tk=clone(SYNC.last.tk||[]);DB.cp=clone(SYNC.last.cp||[]);DB.fn=clone(SYNC.last.fn||[]);DB.qt=clone(SYNC.last.qt||[]);DB.ar=clone(SYNC.last.ar||[]);DB.ht=clone(SYNC.last.ht||[]);
  const refs=SYNC.last.refs||[];
  if(refs.length)REF_KEYS.forEach(k=>{const vals=refs.filter(r=>r.tipo===k).sort((a,b)=>(a.ordem||0)-(b.ordem||0)).map(r=>r.valor);if(vals.length)setRefArray(k,vals);});
}
async function saveDB(){
  if(!SYNC.ready){toast('Base compartilhada ainda não está pronta. Atualize a página e tente novamente.','err');return false;}
  if(SYNC.busy){toast('Aguarde a sincronização atual terminar.','err');return false;}
  SYNC.busy=true;syncStatus('Salvando...','wait');
  try{
    const prev=SYNC.last||{tk:[],cp:[],fn:[],qt:[],ar:[],ht:[],refs:[]};
    await syncTable('tickets',DB.tk,prev.tk);
    await syncTable('compras',DB.cp.map(({pdf,...x})=>x),prev.cp);
    await syncTable('fornecedores',DB.fn,prev.fn);
    await syncAreas(DB.ar,prev.ar);
    await syncTable('historico',DB.ht,prev.ht);
    await syncRefs(refsRows(),prev.refs);
    SYNC.last=clone({tk:DB.tk,cp:DB.cp.map(({pdf,...x})=>x),fn:DB.fn,qt:DB.qt,ar:DB.ar,ht:DB.ht,refs:refsRows()});
    syncStatus('Sincronizado','ok');
    return true;
  }catch(e){
    console.error(e);restoreLastSnapshot();syncStatus('Erro ao sincronizar','err');
    let msg='Não foi possível salvar na base compartilhada';try{const d=JSON.parse(e.message);if(d.message)msg+=': '+d.message;else if(d.details)msg+=': '+d.details;else if(d.hint)msg+=': '+d.hint;}catch{if(e&&e.message)msg+=': '+e.message}
    toast(msg,'err');return false;
  }finally{SYNC.busy=false;}
}
async function loadRemoteDB(first=false){
  if(SYNC.busy)return;
  if(first)syncStatus('Conectando...','wait');
  try{
    const [tk,cp,fn,qt,ar,ht,refs]=await Promise.all([
      sb('tickets?select=*'),sb('compras?select=*'),sb('fornecedores?select=*'),sb('cotacoes?select=*&order=data.desc'),sb('areas?select=nome'),sb('historico?select=*'),sb('referencias?select=*&order=tipo.asc,ordem.asc')
    ]);
    DB.tk=tk||[];DB.cp=cp||[];DB.fn=fn||[];DB.qt=qt||[];DB.ar=(ar||[]).map(x=>x.nome);DB.ht=ht||[];
    if(!DB.ar.length)DB.ar=['Negócios','Marketing','Técnica','Administrativo','Financeiro','Comercial','Outro'];
    if((refs||[]).length){
      REF_KEYS.forEach(k=>{const vals=refs.filter(r=>r.tipo===k).sort((a,b)=>(a.ordem||0)-(b.ordem||0)).map(r=>r.valor);if(vals.length)setRefArray(k,vals);});
    }
    SYNC.last=clone({tk:DB.tk,cp:DB.cp,fn:DB.fn,qt:DB.qt,ar:DB.ar,ht:DB.ht,refs:(refs||[]).length?refsRows():[]});SYNC.ready=true;
    syncStatus('Sincronizado','ok');
    return true;
  }catch(e){console.error(e);syncStatus('Sem conexão','err');return false;}
}

function normSearch(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function runGlobalSearch(){
  const inp=document.getElementById('gsearch'),box=document.getElementById('gsearch-box');if(!inp||!box)return;
  const raw=inp.value.trim(),q=normSearch(raw);
  if(q.length<2){box.classList.remove('on');box.innerHTML='';return;}
  const out=[];
  const hit=(...v)=>normSearch(v.filter(x=>x!=null).join(' ')).includes(q);
  DB.tk.forEach(t=>{if(hit(t.ntk,t.sol,t.area,t.dest,t.ori,t.obs,t.just))out.push({k:'Ticket',ic:'🎫',title:t.ntk?'Ticket #'+t.ntk:'Compra sem ticket',sub:[t.sol,t.area,t.stg].filter(Boolean).join(' · '),type:'ticket',id:t.id});});
  DB.cp.forEach(c=>{if(hit(c.ntk,c.prod,c.desc,c.forn,c.np,c.obs,c.titem,c.tc,c.vb))out.push({k:'Compra',ic:'🛒',title:c.prod||'Compra',sub:[c.ntk?'Ticket #'+c.ntk:null,c.forn,c.np?'Pedido '+c.np:null].filter(Boolean).join(' · '),type:'compra',id:c.id,tid:c.tid});});
  (DB.qt||[]).forEach(c=>{if(hit(c.numero,c.titulo,c.solicitante,c.setor,c.ticket,c.observacoes,JSON.stringify(c.itens||[])))out.push({k:'Cotação',ic:'🧾',title:[c.numero,c.titulo].filter(Boolean).join(' — '),sub:[c.solicitante,c.setor,c.ticket?'Ticket '+c.ticket:null].filter(Boolean).join(' · '),type:'cotacao',id:c.id});});
  (DB.fn||[]).forEach(f=>{if(hit(f.nome,f.cnpj,f.ct,f.email,f.tel))out.push({k:'Fornecedor',ic:'🏢',title:f.nome||'Fornecedor',sub:[f.cnpj,f.ct,f.email].filter(Boolean).join(' · '),type:'fornecedor',id:f.id,nome:f.nome||''});});
  const rank={Ticket:0,Compra:1,Cotação:2,Fornecedor:3};out.sort((a,b)=>(rank[a.k]??9)-(rank[b.k]??9));
  const rows=out.slice(0,14);
  box.innerHTML=rows.length?rows.map((r,i)=>`<div class="gsr" data-gi="${i}" onclick="openGlobalResult('${r.type}','${esc(r.id||'')}','${esc(r.tid||'')}','${esc(r.nome||'')}')"><div class="gsr-ic">${r.ic}</div><div class="gsr-main"><div class="gsr-title">${esc(r.title||'—')}</div><div class="gsr-sub">${esc(r.sub||'')}</div><div class="gsr-kind">${esc(r.k)}</div></div></div>`).join(''):`<div class="gsr-empty">Nenhum resultado para “${esc(raw)}”</div>`;
  box.classList.add('on');
}
function closeGlobalSearch(){document.getElementById('gsearch-box')?.classList.remove('on');}
function openGlobalResult(type,id,tid,nome){
  closeGlobalSearch();const inp=document.getElementById('gsearch');if(inp)inp.value='';
  if(type==='ticket'){nav('consulta',id);return;}
  if(type==='compra'){if(tid){nav('consulta',tid);setTimeout(()=>opEditCP(id),60);}else{CF.s='';nav('compras');setTimeout(()=>opEditCP(id),60);}return;}
  if(type==='cotacao'){nav('cotacoes');setTimeout(()=>openCotacao(id),60);return;}
  if(type==='fornecedor'){if(isAdmin()){nav('aux');}else{CF.s=nome||'';nav('compras');}return;}
}
function globalSearchKey(e){if(e.key==='Escape'){closeGlobalSearch();e.target.blur();}else if(e.key==='Enter'){const first=document.querySelector('#gsearch-box .gsr');if(first){e.preventDefault();first.click();}}}

// reactive
function rc(p){
  const q=parseFloat(gv('qt'+p))||0,u=parseFloat(gv('vu'+p))||0;
  const el=document.getElementById('vt'+p);if(el)el.textContent=fBRL(q*u);
  updCBTotal();
}
function onTC(p){
  const v=gv('tc'+p);sh('sec_pt'+p,v==='Patrimônio');
  if(v==='Patrimônio'){const e=document.getElementById('cpt'+p);if(e&&e.value==='Não aplicável')e.value='Pendente';}
  onCP(p);
}
function onST(p){sh('sec_de'+p,gv('st'+p)==='Entregue')}
function onCP(p){const v=gv('cpt'+p);sh('sec_np'+p,v==='Realizado');sh('sec_dp'+p,v==='Realizado')}
function onFP(p){
  const v=gv('fp'+p);
  if(v==='Boleto'){const e=document.getElementById('pbl'+p);if(e&&e.value==='Não')e.value='Sim';onBL(p);}
  if(v==='Faturado'){const e=document.getElementById('pnf'+p);if(e&&e.value==='Não')e.value='Sim';onNF(p);}
}
function onNF(p){const v=gv('pnf'+p);sh('sec_nff'+p,v==='Sim');if(v!=='Sim')sh('sec_dnf'+p,false);}
function onNFF(p){sh('sec_dnf'+p,gv('nff'+p)==='Sim'&&gv('pnf'+p)==='Sim')}
function onBL(p){const v=gv('pbl'+p);sh('sec_bff'+p,v==='Sim');if(v!=='Sim')sh('sec_dbl'+p,false);}
function onBFF(p){sh('sec_dbl'+p,gv('bff'+p)==='Sim'&&gv('pbl'+p)==='Sim')}
function onNE(p){sh('sec_env'+p,gv('ne'+p)==='Sim')}

function rdCP(p){
  const q=parseFloat(gv('qt'+p))||0,u=parseFloat(gv('vu'+p))||0;
  return{prod:gv('p'+p),desc:gv('ds'+p),titem:gv('ti'+p),qtd:q,vlu:u,vlt:q*u,
    tc:gv('tc'+p),vb:gv('vb'+p),forn:gv('fn'+p),fpag:gv('fp'+p),
    dc:gv('dc'+p),pe:gv('pe'+p),de:gv('de'+p),st:gv('st'+p),
    cp:gv('cpt'+p),np:gv('np'+p),dp:gv('dp'+p),
    pnf:gv('pnf'+p),nff:gv('nff'+p),dnf:gv('dnf'+p),
    pbl:gv('pbl'+p),bff:gv('bff'+p),dbl:gv('dbl'+p),
    ne:gv('ne'+p),env:gv('env'+p),obs:gv('ob'+p)};
}

function fltCP(){
  let r=[...DB.cp];
  if(CF.s){const s=CF.s.toLowerCase();r=r.filter(c=>c.prod.toLowerCase().includes(s)||c.ntk.includes(s)||(c.forn||'').toLowerCase().includes(s))}
  if(CF.st)r=r.filter(c=>c.st===CF.st);
  if(CF.vb)r=r.filter(c=>c.vb===CF.vb);
  if(CF.tc)r=r.filter(c=>c.tc===CF.tc);
  if(CF.fp)r=r.filter(c=>c.fpag===CF.fp);
  if(CF.f1)r=r.filter(c=>c.dc>=CF.f1);
  if(CF.f2)r=r.filter(c=>c.dc<=CF.f2);
  if(CF.nf)r=r.filter(c=>c.pnf==='Sim'&&c.nff==='Não');
  if(CF.bl)r=r.filter(c=>c.pbl==='Sim'&&c.bff==='Não');
  if(CF.pt)r=r.filter(c=>c.tc==='Patrimônio'&&c.cp==='Pendente');
  if(CF.stk)r=r.filter(c=>!c.ntk);
  const{c,d}=CS;
  r.sort((a,b)=>{const va=a[c]??'',vb=b[c]??'';return d==='asc'?(va>vb?1:-1):(va<vb?1:-1)});
  return r;
}
function srtCP(col){if(CS.c===col)CS.d=CS.d==='asc'?'desc':'asc';else{CS.c=col;CS.d='asc'}drwCP()}

function drwCP(){
  const rows=fltCP(),tot=rows.length,pages=Math.ceil(tot/PER)||1;
  if(CP>pages)CP=1;
  const paged=rows.slice((CP-1)*PER,CP*PER);
  const el=document.getElementById('cc-cnt');if(el)el.textContent=`${tot} compra(s)`;
  const tb=document.getElementById('cc-body');if(!tb)return;
  if(!paged.length){tb.innerHTML=`<tr><td colspan="12"><div class="empty"><div class="ei">🔍</div><div class="et">Nenhuma compra encontrada</div><div class="es">Ajuste os filtros ou cadastre uma nova</div></div></td></tr>`;return}
  tb.innerHTML=paged.map(c=>{
    const ov=c.pe&&c.pe<today()&&!['Entregue','Finalizado','Cancelado'].includes(c.st);
    const ch=[];
    if(c.pnf==='Sim'&&c.nff==='Não')ch.push('<span class="chip cr">⚠ NF</span>');
    if(c.pbl==='Sim'&&c.bff==='Não')ch.push('<span class="chip cr">⚠ Boleto</span>');
    if(c.tc==='Patrimônio'&&c.cp==='Pendente')ch.push('<span class="chip ca">🏷 Pat.</span>');
    if(c.ne==='Sim'&&c.env==='Não')ch.push('<span class="chip cbl">📦 Envio</span>');
    return`<tr>
<td>${c.ntk?`<span class="tmo" onclick="nav('consulta','${esc(c.tid)}')">#${esc(c.ntk)}</span>`:'<span class="badge bpu">Sem ticket</span>'}</td>
<td><div class="tm" style="max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(c.prod)}">${esc(c.prod)}</div><div class="tsb">${esc(c.titem)}</div></td>
<td style="font-size:10px;color:var(--s6)">${esc(c.tc)}</td>
<td style="font-size:10px;color:var(--s6)">${esc(c.vb)}</td>
<td style="font-size:11px;color:var(--s6)">${esc(c.forn||'—')}</td>
<td style="font-size:10px;color:var(--s6)">${esc(c.fpag)}</td>
<td style="font-size:11px">${fDt(c.dc)}</td>
<td style="font-size:11px;${ov?'color:var(--red);font-weight:700':''}">${fDt(c.pe)}${ov?' ⚠':''}</td>
<td class="tv">${fBRL(c.vlt)}</td>
<td>${stBadge(c.st)}</td>
<td><div class="chips">${ch.join('')||'<span style="color:var(--s3);font-size:10px">—</span>'}</div></td>
<td style="text-align:center"><div style="display:flex;gap:3px;justify-content:center">
  ${(c.nf_path||(c.anexos||[]).length)?'<button class="btn bg2 bxs" title="Arquivos" onclick="openArquivos(\''+esc(c.id)+'\')">📎</button>':''}
  <button class="btn bg2 bxs" onclick="opEditCP('${esc(c.id)}')">✏️</button>
  <button class="btn bg2 bxs" onclick="opQuick('${esc(c.id)}')">⚡</button>
</div></td>
</tr>`;
  }).join('');
  const pag=document.getElementById('cc-pag');
  if(pag)pag.innerHTML=`<span class="pag-i">${tot} registro(s)${pages>1?` · Pág ${CP}/${pages}`:''}</span>${pages>1?`<button class="btn bs bsm" ${CP===1?'disabled':''} onclick="CP--;drwCP()">← Ant.</button><button class="btn bs bsm" ${CP===pages?'disabled':''} onclick="CP++;drwCP()">Próx. →</button>`:''}`;
}

async function svQuick(id){
  const c=getCP(id);if(!c)return;
  const upd={st:gv('qs-st'),cp:gv('qs-cp'),nff:gv('qs-nf'),bff:gv('qs-bf'),env:gv('qs-ev'),de:gv('qs-de')};
  Object.keys(upd).forEach(k=>addHist(id,k,c[k],upd[k]));
  Object.assign(c,upd,{ap:currentUserLabel(),ae:new Date().toISOString()});
  const ok=await saveDB();closeModal();drwCP();updBdg();if(ok)toast('Compra atualizada!');
}

function opEditCP(id){
  const c=getCP(id);if(!c)return;
  openModal('Editar compra',cFormHTML(c,'_e'),`
<button class="btn bd bsm" onclick="delCP('${id}')">🗑 Excluir</button>
<button class="btn bs bsm" onclick="closeModal()">Cancelar</button>
<button class="btn bp bsm" onclick="svEditCP('${id}')">Salvar alterações</button>`,true);
}
async function svEditCP(id){
  const c=getCP(id);if(!c)return;
  const upd=rdCP('_e');upd.anexos=Array.isArray(c.anexos)?clone(c.anexos):[];
  const nfFile=document.getElementById('pdf_e')?.files[0]||null;
  const extraFiles=[...(document.getElementById('anx_e')?.files||[])];
  let novaNF=null,novos=[];const nfAntiga=c.nf_path||'';
  try{
    syncStatus((nfFile||extraFiles.length)?'Enviando arquivo(s)...':'Salvando...','wait');
    if(nfFile){
      if(nfFile.type&&nfFile.type!=='application/pdf'&&!nfFile.name.toLowerCase().endsWith('.pdf'))throw new Error('A nota fiscal deve ser um arquivo PDF.');
      novaNF=await uploadCompraArquivo(nfFile,id,'nf');upd.nf_path=novaNF.path;upd.nf_nome=novaNF.nome;upd.nf_upload_em=novaNF.enviado_em;
    }else{upd.nf_path=c.nf_path||null;upd.nf_nome=c.nf_nome||null;upd.nf_upload_em=c.nf_upload_em||null;}
    for(const f of extraFiles){novos.push(await uploadCompraArquivo(f,id,'anexos'));}
    if(novos.length)upd.anexos=[...upd.anexos,...novos];
    ['st','nff','bff','cp','fpag','vlt','vlu','pnf','pbl'].forEach(k=>addHist(id,k,c[k],upd[k]));
    Object.assign(c,upd,{ap:currentUserLabel(),ae:new Date().toISOString()});
    const ok=await saveDB();if(!ok)throw new Error('Não foi possível salvar os dados da compra.');
    if(novaNF&&nfAntiga&&nfAntiga!==novaNF.path)apagarArquivoStorage(nfAntiga);
    closeModal();drwCP();updBdg();toast((nfFile||novos.length)?'✓ Compra e arquivos salvos!':'✓ Compra salva!');
  }catch(e){
    console.error(e);if(novaNF)await apagarArquivoStorage(novaNF.path);for(const a of novos)await apagarArquivoStorage(a.path);
    let msg=e&&e.message?e.message:'Não foi possível salvar os arquivos.';try{const d=JSON.parse(msg);msg=d.message||d.error||d.details||msg}catch{}
    syncStatus('Erro ao salvar','err');alert('Não foi possível concluir.\n\nDetalhe: '+msg);
  }
}

async function delCP(id){
  if(!confirm('Excluir esta compra? Não pode ser desfeito.'))return;
  DB.cp=DB.cp.filter(c=>c.id!==id);
  const ok=await saveDB();closeModal();drwCP();updBdg();if(ok)toast('Compra excluída');
}

function addCB(){
  NC++;const n=NC;

  div.className='cblock';div.id='cb'+n;
  div.innerHTML=`<div class="cbh"><span class="cbn">Compra #${n}</span>

function updCBTotal(){
  let s=0;
  for(let i=1;i<=NC;i++){
    if(!document.getElementById('cb'+i))continue;
    s+=(parseFloat(gv('qt'+i))||0)*(parseFloat(gv('vu'+i))||0);
  }
  const e=document.getElementById('cb-tot');if(e)e.textContent=fBRL(s);
}

async function svTK(andNew){
  ['e-tkn','e-tks','e-tka','e-tkj'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=''});
  let ok=true;
  const err=(id,msg)=>{const e=document.getElementById(id);if(e)e.textContent=msg;ok=false};
  const ori=gv('tk-ori'),sol=gv('tk-sol').trim(),area=gv('tk-area').trim(),num=gv('tk-num').trim(),just=gv('tk-just').trim();
  if(!sol)err('e-tks','Campo obrigatório');
  if(!area)err('e-tka','Campo obrigatório');
  if(ori==='Movidesk'&&!num)err('e-tkn','Obrigatório para origem Movidesk');
  if(ori==='Compra sem ticket'&&!just)err('e-tkj','Obrigatório para compra sem ticket');
  for(let i=1;i<=NC;i++){
    if(!document.getElementById('cb'+i))continue;
    if(!gv('p'+i).trim()){const e=document.getElementById('ep'+i);if(e)e.textContent='Produto obrigatório';ok=false;}
  }
  if(!ok){toast('Preencha todos os campos obrigatórios','err');return}

  const tid=uid();
  DB.tk.push({id:tid,ori,ntk:num,lnk:gv('tk-lnk'),sol,area,dest:gv('tk-dest'),dts:gv('tk-data'),stg:gv('tk-st'),obs:gv('tk-obs'),just,cp:currentUserLabel(),ce:new Date().toISOString(),ap:currentUserLabel(),ae:new Date().toISOString()});
  for(let i=1;i<=NC;i++){
    if(!document.getElementById('cb'+i))continue;

    DB.cp.push({...d,id:uid(),tid,ntk:num,cp2:currentUserLabel(),ce:new Date().toISOString(),ap:currentUserLabel(),ae:new Date().toISOString()});

  const syncOk=await saveDB();updBdg();if(!syncOk){nav('cadastro');return;}toast('Ticket e compras cadastrados!');

function doImport(){
  const file=document.getElementById('import-file').files[0];
  if(!file){toast('Selecione um arquivo','err');return}
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      let data=[];
      if(file.name.endsWith('.xlsx')||file.name.endsWith('.xls')){
        const wb=XLSX.read(e.target.result,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        data=XLSX.utils.sheet_to_json(ws);
      }else{
        const text=new TextDecoder().decode(e.target.result);
        const lines=text.split('\\n');
        const headers=lines[0].split(',').map(h=>h.trim().toLowerCase());
        for(let i=1;i<lines.length;i++){
          if(!lines[i].trim())continue;
          const cells=lines[i].split(',');
          const row={};
          headers.forEach((h,j)=>row[h]=(cells[j]||'').trim());
          data.push(row);
        }
      }
      let cnt=0;
      data.forEach(row=>{
        const num=String(row.num_ticket||'').trim(),sol=String(row.solicitante||'').trim();
        if(!sol)return;
        let tid=DB.tk.find(t=>t.ntk===num)?.id;
        if(!tid){
          tid=uid();
          DB.tk.push({id:tid,ori:num?'Movidesk':'Compra sem ticket',ntk:num,lnk:'',sol,area:'Geral',dest:'Corretora',dts:today(),stg:'Aberto',obs:'Importado',just:'',cp:'Sistema',ce:new Date().toISOString(),ap:'Sistema',ae:new Date().toISOString()});
        }
        const qtd=parseFloat(row.quantidade)||1,vlu=parseFloat(row.valor_unitario)||0;
        DB.cp.push({id:uid(),tid,ntk:num,prod:String(row.produto||''),desc:'',titem:'Produto',qtd,vlu,vlt:qtd*vlu,tc:'Uso e Consumo',vb:'A definir',forn:String(row.fornecedor||''),fpag:'Pix',dc:String(row.data_compra||today()),pe:'',de:'',st:String(row.status||'Pendente'),cp:'Não aplicável',np:'',dp:'',pnf:'Não',nff:'Não se aplica',dnf:'',pbl:'Não',bff:'Não se aplica',dbl:'',ne:'Não',env:'Não se aplica',obs:''});
        cnt++;
      });
      if(cnt>0){const ok=await saveDB();if(ok){document.getElementById('import-result').innerHTML='<div class="alert aok">✓ '+cnt+' compra(s) importada(s)</div>';toast('Importado!');}else{document.getElementById('import-result').innerHTML='<div class="alert aerr">✕ Não foi possível sincronizar a importação</div>';}}
      else{document.getElementById('import-result').innerHTML='<div class="alert aerr">✕ Nenhuma compra válida</div>';toast('Nenhuma compra válida','err');}
    }catch(ex){
      document.getElementById('import-result').innerHTML='<div class="alert aerr">✕ Erro: '+esc(ex.message)+'</div>';
      toast('Erro: '+ex.message,'err');
    }
  };
  reader.readAsArrayBuffer(file);
}


function doBackupJSON(){
  try{
    const now=new Date(),stamp=now.toISOString().replace(/[:.]/g,'-');
    const cleanCompras=(DB.cp||[]).map(({pdf,...x})=>x);
    const payload={
      sistema:'Controle de Compras',versao_backup:1,gerado_em:now.toISOString(),gerado_por:currentUserLabel(),
      resumo:{tickets:(DB.tk||[]).length,compras:cleanCompras.length,cotacoes:(DB.qt||[]).length,fornecedores:(DB.fn||[]).length,historico:(DB.ht||[]).length},
      dados:{tickets:DB.tk||[],compras:cleanCompras,cotacoes:DB.qt||[],fornecedores:DB.fn||[],areas:DB.ar||[],referencias:refsRows(),historico:DB.ht||[]}
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='backup-controle-compras-'+stamp+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('✓ Backup completo gerado!');
  }catch(e){console.error(e);toast('Não foi possível gerar o backup','err');}
}

function doExport(tipo){
  const ts=new Date().toISOString().split('T')[0];const wb=XLSX.utils.book_new();
  if(tipo==='tickets'||tipo==='completo'){
    const wsData=DB.tk.map(t=>{
      const tc=cpByTk(t.id);
      return{'Nº':t.ntk||'—','Solicitante':t.sol,'Área':t.area,'Compras':tc.length,'Valor':tc.reduce((a,c)=>a+c.vlt,0),'Status':t.stg,'Data':t.dts};
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wsData),'Tickets');
  }
  if(tipo==='compras'||tipo==='completo'){
    const wsData=DB.cp.map(c=>({'Ticket':c.ntk||'—','Produto':c.prod,'Qtd':c.qtd,'V.Unit':c.vlu,'Total':c.vlt,'Tipo':c.tc,'Verba':c.vb,'Fornecedor':c.forn,'Pgto':c.fpag,'Status':c.st,'Compra':c.dc,'Entrega':c.pe}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wsData),'Compras');
  }
  if(tipo==='cotacoes'||tipo==='completo'){
    const rows=[];
    (DB.qt||[]).forEach(q=>{
      const itens=Array.isArray(q.itens)?q.itens:[];
      if(!itens.length){
        rows.push({'Nº Cotação':q.numero||'—','Título':q.titulo||'—','Data':q.data||'','Solicitante':q.solicitante||'','Setor':q.setor||'','Item':'—','Fornecedor':'—','Qtd':'','Valor un.':'','Frete':'','Total':'','Prazo':'','Pagamento':'','Status':q.status||''});
      } else {
        itens.forEach(it=>{
          const forns=Array.isArray(it.fornecedores)?it.fornecedores:[];
          if(!forns.length){
            rows.push({'Nº Cotação':q.numero||'—','Título':q.titulo||'—','Data':q.data||'','Solicitante':q.solicitante||'','Setor':q.setor||'','Item':it.descricao||'—','Fornecedor':'—','Qtd':it.quantidade||'','Valor un.':'','Frete':'','Total':'','Prazo':'','Pagamento':'','Status':q.status||''});
          } else {
            forns.forEach(f=>rows.push({'Nº Cotação':q.numero||'—','Título':q.titulo||'—','Data':q.data||'','Solicitante':q.solicitante||'','Setor':q.setor||'','Item':it.descricao||'—','Fornecedor':f.fornecedor||'—','Qtd':f.quantidade||it.quantidade||'','Valor un.':f.valor_unitario||'','Frete':f.frete||'','Total':(f.total_final??f.total??'') ,'Prazo':f.prazo||'','Pagamento':f.pagamento||'','Status':q.status||''}));
          }
        });
      }
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Cotacoes');
  }
  XLSX.writeFile(wb,'controle-compras-'+ts+'.xlsx');
  toast('✓ Exportado!');
}

async function saveCotacao(){
  snapshotQuoteItems();
  QD.data=gv('q-data');QD.validade=gv('q-valid')||null;QD.solicitante=gv('q-sol').trim();QD.setor=gv('q-setor').trim();QD.ticket=gv('q-ticket').trim();QD.titulo=gv('q-titulo').trim();QD.status=gv('q-status');QD.observacoes=gv('q-obs').trim();QD.atualizado_em=new Date().toISOString();
  if(!QD.data||!QD.solicitante||!QD.setor||!QD.titulo){toast('Preencha data, solicitante, setor e título','err');return;}
  if(QD.itens.some(i=>!i.descricao.trim())){toast('Preencha o item ou serviço de todos os itens','err');return;}
  if(QD.itens.some(i=>i.fornecedores.some(f=>!f.fornecedor.trim()))){toast('Informe o fornecedor de todas as propostas','err');return;}

async function delCotacao(id){

      <button class="btn bs bsm" onclick="pgUsuarios()">↻ Atualizar</button>
    </div>
    <div class="tw"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Desde</th><th style="text-align:right">Ação</th></tr></thead><tbody>
    ${USERS_APP.map(u=>{
      const self=String(u.user_id)===String(AUTH?.user?.id);
      const role=u.role==='administrador'?'administrador':'usuario';
      return `<tr>
        <td><div style="font-weight:750;color:var(--s8)">${esc(u.nome||'Usuário')} ${self?'<span class="badge bk" style="margin-left:5px">Você</span>':''}</div></td>
        <td style="color:var(--s6)">${esc(u.email||'—')}</td>
        <td><select class="fs" id="usr-role-${esc(u.user_id)}" ${self?'disabled':''} style="min-width:132px;padding:7px 9px;font-size:11px">
          <option value="usuario" ${role==='usuario'?'selected':''}>Usuário</option>
          <option value="administrador" ${role==='administrador'?'selected':''}>Administrador</option>
        </select></td>
        <td style="color:var(--s6)">${fmtUserDate(u.criado_em)}</td>
        <td style="text-align:right">${self?'<span style="font-size:10px;color:var(--s5)">Perfil protegido</span>':`<button class="btn bp bsm" onclick="salvarPerfilUsuario('${esc(u.user_id)}','${esc(u.nome||u.email||'usuário')}')">Salvar</button>`}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}
async function salvarPerfilUsuario(userId,label){
  if(!isAdmin()){toast('Acesso restrito ao administrador','err');return;}
  if(String(userId)===String(AUTH?.user?.id)){toast('Seu próprio perfil de administrador é protegido','err');return;}
  const sel=document.getElementById('usr-role-'+userId);if(!sel)return;
  const novo=sel.value;
  const atual=USERS_APP.find(x=>String(x.user_id)===String(userId))?.role||'usuario';
  if(novo===atual){toast('Nenhuma alteração para salvar');return;}
  const nomePerfil=novo==='administrador'?'Administrador':'Usuário';
  if(!confirm(`Alterar ${label} para ${nomePerfil}?`)){sel.value=atual;return;}
  sel.disabled=true;syncStatus('Atualizando perfil...','wait');
  try{
    await sb('rpc/alterar_perfil_usuario',{method:'POST',body:JSON.stringify({alvo:userId,novo_role:novo})});
    syncStatus('Sincronizado','ok');toast('Perfil atualizado!');await pgUsuarios();
  }catch(e){
    console.error('Erro ao alterar perfil:',e);sel.value=atual;sel.disabled=false;syncStatus('Erro ao atualizar perfil','err');
    let detalhe=e?.message||'Erro desconhecido';try{const d=JSON.parse(detalhe);detalhe=d.message||d.details||d.hint||detalhe}catch{}
    alert('Não foi possível alterar o perfil.\n\nDetalhe: '+detalhe);
  }
}

// ── AUX ───────────────────────────────────────────
let AUXTAB='forn';
function pgAux(){
  document.getElementById('ct').innerHTML=`
<div class="ph"><div><h1 class="pt">Cadastros Auxiliares</h1><p class="ps">Gerencie fornecedores, áreas e opções</p></div></div>
<div class="tabs">
  <button class="tab ${AUXTAB==='forn'?'on':''}" onclick="swAux('forn')">🏢 Fornecedores</button>
  <button class="tab ${AUXTAB==='areas'?'on':''}" onclick="swAux('areas')">🏷 Áreas</button>
  <button class="tab ${AUXTAB==='ref'?'on':''}" onclick="swAux('ref')">📋 Referências</button>
</div>
<div id="aux-c"></div>`;
  drwAux();
}
function swAux(t){AUXTAB=t;document.querySelectorAll('.tab').forEach((e,i)=>e.classList.toggle('on',['forn','areas','ref'][i]===t));drwAux()}
function drwAux(){const e=document.getElementById('aux-c');if(AUXTAB==='forn')drwForn(e);else if(AUXTAB==='areas')drwAreas(e);else drwRefs(e)}

function drwForn(el){
  el.innerHTML=`
<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn bp bsm" onclick="opFornModal()">+ Novo fornecedor</button></div>
<div class="tw card"><table>
<thead><tr><th>Nome</th><th>CNPJ/CPF</th><th>Contato</th><th>Telefone</th><th>E-mail</th><th>Status</th><th style="text-align:center">Ações</th></tr></thead>
<tbody>${DB.fn.length===0?`<tr><td colspan="7"><div class="empty"><div class="ei">🏢</div><div class="et">Nenhum fornecedor</div></div></td></tr>`
:DB.fn.map(f=>`<tr>
<td class="tm">${esc(f.nome)}</td>
<td style="font-family:monospace;font-size:10px;color:var(--s5)">${esc(f.cnpj||'—')}</td>
<td style="font-size:11px">${esc(f.ct||'—')}</td>
<td style="font-size:11px">${esc(f.tel||'—')}</td>
<td style="font-size:11px">${esc(f.email||'—')}</td>
<td><span class="badge ${f.ativo?'bg':'bk'}">${f.ativo?'Ativo':'Inativo'}</span></td>
<td style="text-align:center"><div style="display:flex;gap:3px;justify-content:center">
  <button class="btn bg2 bxs" onclick="opFornModal('${esc(f.id)}')">✏️</button>
  <button class="btn bd bxs" onclick="delForn('${esc(f.id)}')">🗑</button>
</div></td></tr>`).join('')}
</tbody></table></div>`;
}
function opFornModal(id){
  const f=id?DB.fn.find(x=>x.id===id):null;
  const v=(k,d='')=>f?f[k]??d:d;
  openModal(id?'Editar Fornecedor':'Novo Fornecedor',`
<div class="fg fg2" style="gap:12px">
  <div class="fgroup"><label class="lbl">Nome<span class="req">*</span></label><input class="fi" id="fn-n" value="${esc(v('nome'))}"></div>
  <div class="fgroup"><label class="lbl">CNPJ / CPF</label><input class="fi" id="fn-c" value="${esc(v('cnpj'))}" placeholder="00.000.000/0001-00"></div>
  <div class="fgroup"><label class="lbl">Contato</label><input class="fi" id="fn-ct" value="${esc(v('ct'))}"></div>
  <div class="fgroup"><label class="lbl">Telefone</label><input class="fi" id="fn-t" value="${esc(v('tel'))}"></div>
  <div class="fgroup" style="grid-column:1/-1"><label class="lbl">E-mail</label><input type="email" class="fi" id="fn-e" value="${esc(v('email'))}"></div>
  <div class="fgroup" style="grid-column:1/-1"><label class="lbl">Observações</label><textarea class="fta" id="fn-o">${esc(v('obs'))}</textarea></div>
  <label style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;cursor:pointer;grid-column:1/-1">
    <input type="checkbox" id="fn-a" ${f===null||v('ativo',true)?'checked':''} style="accent-color:var(--brand);width:14px;height:14px"> Fornecedor ativo</label>
</div>`,
`<button class="btn bs bsm" onclick="closeModal()">Cancelar</button>
<button class="btn bp bsm" onclick="svForn('${id||''}')">Salvar</button>`);
}
async function svForn(id){
  const nome=gv('fn-n').trim();if(!nome){toast('Nome obrigatório','err');return}
  const data={nome,cnpj:gv('fn-c'),ct:gv('fn-ct'),tel:gv('fn-t'),email:gv('fn-e'),obs:gv('fn-o'),ativo:document.getElementById('fn-a').checked};
  if(id){const f=DB.fn.find(x=>x.id===id);if(f)Object.assign(f,data);}
  else DB.fn.push({...data,id:uid()});
  const ok=await saveDB();closeModal();drwForn(document.getElementById('aux-c'));if(ok)toast(id?'Fornecedor atualizado!':'Fornecedor cadastrado!');
}
async function delForn(id){if(!confirm('Excluir fornecedor?'))return;DB.fn=DB.fn.filter(x=>x.id!==id);const ok=await saveDB();drwForn(document.getElementById('aux-c'));if(ok)toast('Excluído')}

function drwAreas(el){
  el.innerHTML=`<div class="card"><div class="cb2">
<p style="font-size:12px;color:var(--s5);margin-bottom:12px">Áreas disponíveis na lista ao cadastrar tickets.</p>
<div style="display:flex;gap:8px;margin-bottom:14px">
  <input class="fi" style="flex:1" id="na" placeholder="Nova área..." onkeydown="if(event.key==='Enter')addArea()">
  <button class="btn bp bsm" onclick="addArea()">Adicionar</button>
</div>
<div style="display:flex;flex-direction:column;gap:7px">
  ${DB.ar.map((a,idx)=>`<div style="display:flex;align-items:center;gap:8px;background:var(--s1);border-radius:8px;padding:7px 10px">
<span style="font-size:12px;font-weight:600;color:var(--s7);flex:1">${esc(a)}</span>
<button class="btn bg2 bxs" onclick="editArea(${idx})">✏️ Editar</button>
<button class="btn bd bxs" onclick="rmArea(${idx})">🗑 Remover</button>
</div>`).join('')}
</div></div></div>`;
}
async function addArea(){const a=gv('na').trim();if(!a)return;if(DB.ar.some(x=>x.toLowerCase()===a.toLowerCase())){toast('Esta área já existe','err');return}DB.ar.push(a);const ok=await saveDB();drwAreas(document.getElementById('aux-c'));if(ok)toast('Área adicionada')}
async function editArea(idx){
  const atual=DB.ar[idx];if(atual==null)return;
  const val=prompt('Editar área:',atual);if(val===null)return;
  const novo=val.trim();if(!novo)return;
  if(DB.ar.some((x,i)=>i!==idx&&x.toLowerCase()===novo.toLowerCase())){toast('Esta área já existe','err');return}
  DB.ar[idx]=novo;const ok=await saveDB();drwAreas(document.getElementById('aux-c'));if(ok)toast('Área atualizada');
}
async function rmArea(idx){const a=DB.ar[idx];if(a==null)return;if(!confirm(`Remover "${a}"?`))return;DB.ar.splice(idx,1);const ok=await saveDB();drwAreas(document.getElementById('aux-c'));if(ok)toast('Área removida')}

function drwRefs(el){
  const gs=[[' Status da Compra',STCP,'STCP'],[' Status do Ticket',STKG,'STKG'],[' Origens',ORI,'ORI'],[' Tipos de Compra',TCOMP,'TCOMP'],[' Verbas',VERB,'VERB'],[' Formas de Pagamento',FPAG,'FPAG'],[' Tipos de Item',TITEM,'TITEM'],[' Destinos',DEST,'DEST'],[' Cadastro Patrimonial',CPAT,'CPAT']];
  el.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">
${gs.map(([t,i,k])=>`<div class="card"><div class="ch" style="justify-content:space-between"><span class="ct2">${esc(t)}</span><span class="badge bk" style="font-size:9px">${i.length}</span></div><div style="padding:10px 16px">
<div style="margin-bottom:10px">${i.map((x,idx)=>`<div style="display:flex;gap:6px;padding:4px 0;align-items:center;border-bottom:1px solid var(--s0)"><span style="flex:1;font-size:11px;color:var(--s6)">${esc(x)}</span><button class="btn bg2 bxs" onclick="editRef('${k}',${idx})">✏️</button><button class="btn bd bxs" onclick="delRef('${k}',${idx})">🗑</button></div>`).join('')}</div>
<div style="display:flex;gap:5px"><input type="text" id="nr-${k}" placeholder="Novo..." style="flex:1;padding:6px;font-size:10px;border:1.5px solid var(--s2);border-radius:6px"><button class="btn bp bxs" onclick="addRef('${k}')">➕</button></div></div></div>`).join('')}
</div>`;
}
async function addRef(tipo){const el=document.getElementById('nr-'+tipo);const v=el.value.trim();if(!v)return;const arr=refArray(tipo);if(!arr)return;if(arr.some(x=>x.toLowerCase()===v.toLowerCase())){toast('Esta opção já existe','err');return}arr.push(v);const ok=await saveDB();drwRefs(document.querySelector('#aux-c'));if(ok)toast('✓ Adicionado');}
async function editRef(tipo,idx){const arr=refArray(tipo);if(!arr||arr[idx]==null)return;const val=prompt('Editar:',arr[idx]);if(val===null)return;const novo=val.trim();if(!novo)return;if(arr.some((x,i)=>i!==idx&&x.toLowerCase()===novo.toLowerCase())){toast('Esta opção já existe','err');return}arr[idx]=novo;const ok=await saveDB();drwRefs(document.querySelector('#aux-c'));if(ok)toast('✓ Alterado');}
async function delRef(tipo,idx){const arr=refArray(tipo);if(!arr||arr[idx]==null)return;const atual=arr[idx];if(!confirm(`Remover "${atual}"?`))return;arr.splice(idx,1);const ok=await saveDB();drwRefs(document.querySelector('#aux-c'));if(ok)toast('✓ Removido');}

// ── ARQUIVOS DA COMPRA ────────────────────────────
function openArquivos(id){
  const c=getCP(id);if(!c)return;const itens=[];
  if(c.nf_path)itens.push({nome:c.nf_nome||'Nota fiscal.pdf',path:c.nf_path,tipo:'Nota fiscal'});
  (c.anexos||[]).forEach(a=>itens.push({nome:a.nome||'Anexo',path:a.path,tipo:'Anexo'}));
  if(!itens.length){toast('Esta compra ainda não possui arquivos','err');return;}
  openModal('Arquivos da compra',`<div style="display:flex;flex-direction:column;gap:8px">${itens.map(a=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--s2);border-radius:9px;background:#fff"><div style="font-size:20px">${a.tipo==='Nota fiscal'?'📄':'📎'}</div><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:700;color:var(--s8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.nome)}</div><div style="font-size:9px;color:var(--s4);margin-top:2px">${esc(a.tipo)}</div></div><button class="btn bp bxs" onclick="baixarArquivoStorage('${esc(a.path)}','${esc(a.nome)}')">Baixar</button></div>`).join('')}</div>`,`<button class="btn bs bsm" onclick="closeModal()">Fechar</button>`);
}
function viewPDF(id){openArquivos(id)}

  const ok=await ensureAuth();
  if(!ok){showLogin(true);syncStatus('Aguardando login','wait');return;}
  showLogin(false);await loadUserProfile();
  await loadRemoteDB(true);nav('dashboard');startSyncTimer();
})();
</script>
